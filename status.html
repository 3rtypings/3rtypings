<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track your 3R Typing Service order</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#081a35;--blue:#087cf0;--cyan:#18bde9;--ink:#172b48;--muted:#73839a;--line:#e3ebf5;--green:#159b61;--gold:#e5a719}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 12%,#dff4ff,transparent 32%),#f4f8fd;color:var(--ink);font-family:'DM Sans',sans-serif}.top{padding:20px max(5%,calc((100% - 1000px)/2));background:linear-gradient(110deg,#06152e,#0b3260);color:#fff}.brand{font:800 18px Manrope}.brand span{color:#29c7f4}.top small{display:block;color:#b8d0eb;font-size:10px;letter-spacing:2px;margin-top:4px}.wrap{width:min(780px,92%);margin:6vh auto}.card{background:white;border:1px solid var(--line);border-radius:23px;padding:clamp(22px,5vw,38px);box-shadow:0 24px 70px #17395c14}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.13em;color:var(--blue)}h1{font:800 clamp(25px,5vw,34px) Manrope;margin:9px 0}.muted{color:var(--muted);font-size:14px;line-height:1.65}.statusTop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}.orderNo{color:var(--muted);font-size:12px;margin-top:7px}.badge{display:inline-flex;align-items:center;gap:7px;border-radius:30px;background:#eaf3ff;color:#1763ad;padding:9px 13px;font-size:12px;font-weight:900}.dot{width:8px;height:8px;border-radius:50%;background:currentColor}.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:28px 0 24px;position:relative}.step{text-align:center;position:relative;color:#9aa8b9;font-size:11px;font-weight:800}.step:before{content:"";display:block;width:30px;height:30px;border-radius:50%;background:#e9eef5;margin:0 auto 9px;position:relative;z-index:1}.step:after{content:"";position:absolute;height:3px;background:#e9eef5;top:14px;left:calc(50% + 20px);width:calc(100% - 40px)}.step:last-child:after{display:none}.step.done{color:#148052}.step.done:before{background:#19a96c;box-shadow:inset 0 0 0 8px #e2f7ed}.step.done:after{background:#19a96c}.step.current{color:#087cf0}.step.current:before{background:#ddebff;box-shadow:inset 0 0 0 8px #087cf0,0 0 0 5px #087cf01a}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detail{padding:13px 14px;border:1px solid #e8eef5;border-radius:12px;background:#fbfdff;min-width:0}.detail b{display:block;color:#71839a;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}.detail span{display:block;font-size:14px;font-weight:700;overflow-wrap:anywhere}.updated{margin-top:16px;text-align:right;font-size:11px;color:#95a2b2}.state{padding:28px 8px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}.state.error{color:#b64747}.hidden{display:none!important}@media(max-width:560px){.details{grid-template-columns:1fr}.wrap{margin:4vh auto}.step{font-size:10px}}
</style></head>
<body><header class="top"><div class="brand">3R TYPING SERVICE <span>/ ORDER TRACKING</span><small>PRIVATE CUSTOMER STATUS PAGE</small></div></header>
<main class="wrap"><section class="card"><div id="loading" class="state">Loading your order status…</div><div id="error" class="state error hidden"></div><div id="statusContent" class="hidden"><div class="statusTop"><div><div class="eyebrow">YOUR PROJECT</div><h1 id="projectTitle">Project status</h1><div class="orderNo">Order <span id="orderNumber"></span></div></div><div class="badge"><span class="dot"></span><span id="statusBadge">New</span></div></div><div class="timeline"><div class="step" id="step1">Order received</div><div class="step" id="step2">In progress</div><div class="step" id="step3">Completed</div></div><div class="details"><div class="detail"><b>Pages</b><span id="pages">—</span></div><div class="detail"><b>Deadline</b><span id="deadline">—</span></div><div class="detail"><b>Estimated total</b><span id="total">—</span></div><div class="detail"><b>Payment status</b><span id="paymentStatus">—</span></div><div class="detail"><b>Amount received</b><span id="amountPaid">—</span></div><div class="detail"><b>Balance due</b><span id="balanceDue">—</span></div></div><div class="updated" id="updatedAt"></div></div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDBMIx3Rie5lanEh-NJuwDiKGVsa-H0lI4",authDomain:"r-typings.firebaseapp.com",projectId:"r-typings",storageBucket:"r-typings.firebasestorage.app",messagingSenderId:"483139906006",appId:"1:483139906006:web:8630c6d0f7373e95699c77"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),token=new URLSearchParams(location.search).get('token')||'';
const $=id=>document.getElementById(id);const money=n=>'Rs. '+Number(n||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2});function formatDate(v){if(!v)return'—';const d=v.toDate?v.toDate():new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString();}function showError(text){$('loading').classList.add('hidden');$('statusContent').classList.add('hidden');$('error').textContent=text;$('error').classList.remove('hidden');}
function renderOrder(o){$('loading').classList.add('hidden');$('error').classList.add('hidden');$('statusContent').classList.remove('hidden');$('projectTitle').textContent=o.projectType||'Typing project';$('orderNumber').textContent='#'+String(o.orderId||'').slice(-8).toUpperCase();const status=String(o.status||'New');$('statusBadge').textContent=status;const s=status.toLowerCase(),step=s==='completed'?3:s==='in progress'||s==='on hold'?2:1;for(let i=1;i<=3;i++){$('step'+i).classList.toggle('done',i<step||(i===3&&step===3));$('step'+i).classList.toggle('current',i===step&&step<3);}$('pages').textContent=String(o.pages||0);$('deadline').textContent=formatDate(o.deadlineISO);$('total').textContent=money(o.estimatedTotal);$('paymentStatus').textContent=o.paymentStatus||'Pending';$('amountPaid').textContent=money(o.amountPaid);$('balanceDue').textContent=money(o.balanceDue);$('updatedAt').textContent=o.updatedAt?'Last updated '+formatDate(o.updatedAt):'Status updates appear here automatically.';}
if(!/^[a-f0-9]{64}$/i.test(token)){showError('This tracking link is incomplete. Please ask 3R Typing Service for a new link.');}else{db.collection('publicOrderStatus').doc(token).onSnapshot(snapshot=>{if(!snapshot.exists){showError('We are preparing your tracking page. Please refresh in a moment.');return;}renderOrder(snapshot.data()||{});},error=>{console.error(error);showError('We could not load this order status. Please try again later or contact 3R Typing Service.');});}
</script></body></html>
